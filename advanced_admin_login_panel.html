<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Panel</title>
    <!-- Include Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Include Phosphor Icons for UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            /* Define CSS variables for a consistent color theme */
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
            --input-bg: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Full-screen background with a subtle gradient */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            padding: 20px;
        }

        /* Container for the login card */
        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Entry animation for the card */
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Back to Home Button Styling */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .back-btn:hover {
            color: var(--text-main);
            transform: translateX(-4px);
        }

        .back-btn i {
            font-size: 18px;
        }

        /* Header styling */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Styling the form and input groups */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 20px;
            transition: color 0.3s ease;
        }

        /* Input field styling */
        .form-control {
            width: 100%;
            padding: 14px 14px 14px 44px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-control:focus + i,
        .form-control:not(:placeholder-shown) + i {
            color: var(--primary);
        }

        /* Password visibility toggle button */
        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* Options row (Remember me, Forgot password) */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-wrapper input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-wrapper input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 6px;
            width: 4px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--primary-hover);
        }

        /* Submit button styling */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Error message styling */
        .error-message {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 4px;
            animation: shake 0.4s ease-in-out;
        }

        /* Shake animation for errors */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Decorative background elements */
        .bg-shape {
            position: absolute;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            border-radius: 50%;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.2);
        }

        .shape-2 {
            bottom: -150px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
        }
    </style>
</head>
<body>
    <!-- Decorative background blobs -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-container">
        <!-- Back to Home Button added here -->
        <a href="index.html" class="back-btn">
            <i class="ph ph-arrow-left"></i> Back to Dashboard
        </a>

        <!-- Header -->
        <div class="login-header">
            <h2>Admin Portal</h2>
            <p>Enter your credentials to access the dashboard</p>
        </div>

        <!-- Login Form -->
        <form id="adminLoginForm" onsubmit="handleLogin(event)">
            <!-- User ID Input -->
            <div class="form-group">
                <label for="userId">Admin ID</label>
                <div class="input-wrapper">
                    <input type="text" id="userId" class="form-control" placeholder="Enter your ID" autocomplete="off" required>
                    <i class="ph ph-user"></i>
                </div>
                <!-- Error placeholder -->
                <div id="idError" class="error-message">
                    <i class="ph ph-warning-circle"></i> Invalid Admin ID
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    <i class="ph ph-lock-key"></i>
                    <!-- Toggle visibility button -->
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <i class="ph ph-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <!-- Error placeholder -->
                <div id="passError" class="error-message">
                    <i class="ph ph-warning-circle"></i> Incorrect Password
                </div>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link" onclick="handleForgot(event)">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Sign In</span>
                <div class="spinner" id="btnSpinner"></div>
                <i class="ph ph-arrow-right" id="btnIcon"></i>
            </button>
        </form>
    </div>

    <script>
        // Target credentials specified by the user
        const TARGET_ID = 'abhi7763';
        const TARGET_PASS = '702711';

        // Function to toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        // Function to handle form submission
        function handleLogin(event) {
            // Prevent default form submission
            event.preventDefault();

            // Get elements
            const userIdInput = document.getElementById('userId');
            const passwordInput = document.getElementById('password');
            const idError = document.getElementById('idError');
            const passError = document.getElementById('passError');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');

            // Reset errors
            idError.style.display = 'none';
            passError.style.display = 'none';
            userIdInput.style.borderColor = 'var(--border-color)';
            passwordInput.style.borderColor = 'var(--border-color)';

            const userId = userIdInput.value.trim();
            const password = passwordInput.value;

            let hasError = false;

            // Validate credentials
            if (userId !== TARGET_ID) {
                idError.style.display = 'flex';
                userIdInput.style.borderColor = 'var(--error-color)';
                // Trigger shake animation by re-adding the element
                idError.style.animation = 'none';
                idError.offsetHeight; /* trigger reflow */
                idError.style.animation = null; 
                hasError = true;
            }

            if (password !== TARGET_PASS) {
                passError.style.display = 'flex';
                passwordInput.style.borderColor = 'var(--error-color)';
                // Trigger shake animation
                passError.style.animation = 'none';
                passError.offsetHeight; /* trigger reflow */
                passError.style.animation = null;
                hasError = true;
            }

            // If credentials are correct, simulate a loading state then redirect
            if (!hasError) {
                // UI state: Loading
                submitBtn.disabled = true;
                btnText.textContent = 'Authenticating...';
                btnIcon.style.display = 'none';
                btnSpinner.style.display = 'block';

                // Simulate network delay for professional feel
                setTimeout(() => {
                    // Success UI state
                    btnText.textContent = 'Success!';
                    btnSpinner.style.display = 'none';
                    btnIcon.className = 'ph ph-check-circle';
                    btnIcon.style.display = 'block';
                    submitBtn.style.backgroundColor = '#10b981'; // Success green

                    // Redirect after short delay
                    setTimeout(() => {
                        // SET SESSION STORAGE HERE!
                        sessionStorage.setItem('adminLoggedIn', 'true');
                        window.location.href = 'admin.html';
                    }, 600);

                }, 1000);
            }
        }

        // Handle forgot password link click
        function handleForgot(event) {
            event.preventDefault();
            // Create a custom notification instead of standard alert
            createNotification("Contact the Super Admin to reset your credentials.");
        }

        // Helper function for custom notifications
        function createNotification(message) {
            const notif = document.createElement('div');
            notif.textContent = message;
            notif.style.position = 'fixed';
            notif.style.top = '20px';
            notif.style.left = '50%';
            notif.style.transform = 'translateX(-50%) translateY(-20px)';
            notif.style.backgroundColor = 'var(--card-bg)';
            notif.style.color = 'var(--text-main)';
            notif.style.padding = '12px 24px';
            notif.style.borderRadius = '8px';
            notif.style.border = '1px solid var(--border-color)';
            notif.style.boxShadow = '0 10px 15px -3px rgba(0, 0, 0, 0.5)';
            notif.style.zIndex = '1000';
            notif.style.opacity = '0';
            notif.style.transition = 'all 0.3s ease';
            
            document.body.appendChild(notif);

            // Animate in
            setTimeout(() => {
                notif.style.opacity = '1';
                notif.style.transform = 'translateX(-50%) translateY(0)';
            }, 10);

            // Animate out and remove
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
