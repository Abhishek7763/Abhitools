<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Login Panel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AbhiTools">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
            --input-bg: #0f172a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main); padding: 20px;
        }
        .login-container {
            width: 100%; max-width: 420px; background-color: var(--card-bg);
            border-radius: 16px; padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0; transform: translateY(20px);
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); text-decoration: none;
            font-size: 14px; font-weight: 500; margin-bottom: 20px;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .back-btn:hover { color: var(--text-main); transform: translateX(-4px); }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .login-header p { color: var(--text-muted); font-size: 14px; }
        .form-group { margin-bottom: 24px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 14px; color: var(--text-muted); font-size: 18px; line-height:1; pointer-events:none; }
        .form-control {
            width: 100%; padding: 14px 14px 14px 44px;
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 10px; color: var(--text-main); font-size: 15px;
            outline: none; transition: all 0.3s ease;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
        .toggle-password {
            position: absolute; right: 14px; background: none; border: none;
            color: var(--text-muted); cursor: pointer; font-size: 20px;
            padding: 0; display: flex; align-items: center;
        }
        .toggle-password:hover { color: var(--text-main); }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 14px; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-wrapper input[type="checkbox"] {
            appearance: none; width: 18px; height: 18px;
            border: 1px solid var(--border-color); border-radius: 4px;
            background-color: var(--input-bg); cursor: pointer; position: relative;
        }
        .checkbox-wrapper input[type="checkbox"]:checked { background-color: var(--primary); border-color: var(--primary); }
        .checkbox-wrapper input[type="checkbox"]:checked::after {
            content: ''; position: absolute; top: 2px; left: 6px;
            width: 4px; height: 10px; border: solid white;
            border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .btn-submit {
            width: 100%; padding: 14px; background-color: var(--primary);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; display: flex;
            justify-content: center; align-items: center; gap: 8px;
        }
        .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-submit:active { transform: translateY(1px); }
        .error-message {
            color: var(--error-color); font-size: 13px; margin-top: 6px;
            display: none; align-items: center; gap: 4px;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: white; animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .bg-shape { position: absolute; filter: blur(80px); opacity: 0.5; z-index: -1; border-radius: 50%; }
        .shape-1 { top: -100px; left: -100px; width: 300px; height: 300px; background: rgba(59,130,246,0.2); }
        .shape-2 { bottom: -150px; right: -100px; width: 400px; height: 400px; background: rgba(139,92,246,0.15); }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-container">
        <a href="index.html" class="back-btn">
            <span aria-hidden="true">←</span> Back to Dashboard
        </a>
        <div class="login-header">
            <h2>Admin Portal</h2>
            <p>Enter your credentials to access the dashboard</p>
        </div>

        <form id="adminLoginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="userId">Admin ID</label>
                <div class="input-wrapper">
                    <input type="text" id="userId" class="form-control" placeholder="Enter your ID" autocomplete="off" required>
                    <span class="input-icon" aria-hidden="true">👤</span>
                </div>
                <div id="idError" class="error-message">
                    <span aria-hidden="true">⚠️</span> Invalid Admin ID
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    <span class="input-icon" aria-hidden="true">🔐</span>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <span id="eyeIcon" aria-hidden="true">👁️</span>
                    </button>
                </div>
                <div id="passError" class="error-message">
                    <span aria-hidden="true">⚠️</span> Incorrect Password
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Sign In</span>
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnIcon" aria-hidden="true">→</span>
            </button>
        </form>
    </div>

    <script src="pwa.js"></script>
    <script>
        // ✅ Koi bhi hardcoded password ya ID nahi hai
        // Credentials Vercel environment variables mein hain
        // /api/auth endpoint se verify hoga

        // Agar valid secure session already hai to login screen skip karo.
        fetch('/api/auth', { cache: 'no-store' })
            .then(response => { if (response.ok) window.location.replace('admin.html'); })
            .catch(() => {});

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = '👁️';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const userIdInput = document.getElementById('userId');
            const passwordInput = document.getElementById('password');
            const idError = document.getElementById('idError');
            const passError = document.getElementById('passError');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');

            // Errors reset karo
            idError.style.display = 'none';
            passError.style.display = 'none';
            userIdInput.style.borderColor = 'var(--border-color)';
            passwordInput.style.borderColor = 'var(--border-color)';

            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Authenticating...';
            btnIcon.style.display = 'none';
            btnSpinner.style.display = 'block';

            try {
                // Secure API call - credentials server par verify honge
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userIdInput.value.trim(),
                        password: passwordInput.value
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Success
                    btnText.textContent = 'Success!';
                    btnSpinner.style.display = 'none';
                    btnIcon.textContent = '✓';
                    btnIcon.style.display = 'block';
                    submitBtn.style.backgroundColor = '#10b981';

                    // Server has set a signed HttpOnly session cookie.
                    passwordInput.value = '';

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 600);

                } else {
                    // Error
                    btnText.textContent = 'Sign In';
                    btnSpinner.style.display = 'none';
                    btnIcon.style.display = 'block';
                    submitBtn.disabled = false;

                    idError.style.display = 'flex';
                    passError.style.display = 'flex';
                    userIdInput.style.borderColor = 'var(--error-color)';
                    passwordInput.style.borderColor = 'var(--error-color)';
                }

            } catch (err) {
                btnText.textContent = 'Sign In';
                btnSpinner.style.display = 'none';
                btnIcon.style.display = 'block';
                submitBtn.disabled = false;
                alert('Network error! Internet connection check karein.');
            }
        }
    </script>
</body>
</html>
