<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Login Panel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AbhiTools">
    <link rel="stylesheet" href="admin_login.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-container">
        <a href="index.html" class="back-btn">
            <span aria-hidden="true">←</span> Back to Dashboard
        </a>
        <div class="login-header">
            <h2>Admin Portal</h2>
            <p>Enter your credentials to access the dashboard</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="userId">Admin ID</label>
                <div class="input-wrapper">
                    <input type="text" id="userId" name="username" class="form-control" placeholder="Enter admin ID" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="idError" required>
                    <span class="input-icon" aria-hidden="true">👤</span>
                </div>
                <div id="idError" class="error-message">
                    <span aria-hidden="true">⚠️</span> Invalid Admin ID
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" autocomplete="current-password" aria-describedby="passError" required>
                    <span class="input-icon" aria-hidden="true">🔐</span>
                    <button type="button" class="toggle-password" aria-label="Show password" aria-controls="password">
                        <span id="eyeIcon" aria-hidden="true">👁️</span>
                    </button>
                </div>
                <div id="passError" class="error-message">
                    <span aria-hidden="true">⚠️</span> Incorrect Password
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Sign In</span>
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnIcon" aria-hidden="true">→</span>
            </button>
        </form>
    </div>

    <script src="pwa.js"></script>
    <script src="admin_login.js"></script>
</body>
</html>
