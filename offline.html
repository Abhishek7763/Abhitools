<!DOCTYPE html>
<html lang="hi">
<head>

  <style>

    <div class="actions"><button class="btn primary" onclick="location.reload()">🔄 Try Again</button><button class="btn secondary" onclick="location.href='/index.html'">🏠 Home</button></div>
