<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Abhishek Management Tool</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AbhiTools">
    <link rel="stylesheet" href="style.css">
</head>
<body class="has-mobile-app-nav public-page">

    <!-- Header -->
    <div class="header-container no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
        <div>
            <button id="darkModeBtn" class="btn btn-secondary" onclick="toggleDarkMode()" style="font-size:11px;padding:5px 10px;">🌙 Dark</button>
            <button id="installAppBtn" data-pwa-install class="btn btn-success" style="display:none;font-size:11px;padding:5px 10px;margin-left:5px;">⬇️ Install</button>
        </div>
        <h2 class="no-print" style="margin:0;flex-grow:1;text-align:center;">Abhishek Management</h2>
        <div id="lastUpdatedBadge" class="clickable-badge" onclick="manualSync()" title="Click to Sync"
            style="font-size:10px;background:#e8f0fe;color:#1a73e8;padding:5px 8px;border-radius:4px;border:1px solid #1a73e8;font-weight:600;text-align:center;line-height:1.2;">
            Updated:<br>N/A
        </div>
    </div>

    <!-- Print Header -->
    <div class="print-only" id="printHeader">
        <h1>Abhishek Management</h1>
        <p><strong>Official Loan Account Statement</strong></p>
        <p id="printDateDisplay"></p>
    </div>

    <!-- Aaj Ki Due EMIs Badge -->
    <div id="todayDueBadge" class="no-print" style="display:none;background:#fff3cd;color:#856404;padding:10px 15px;border-radius:8px;margin-bottom:15px;font-weight:600;font-size:14px;border-left:4px solid #ffc107;text-align:center;"></div>

    <!-- Dashboard -->
    <div class="dashboard no-print" id="dashboard">
        <div class="dash-box">
            <h4>Active Loans</h4>
            <h3 id="totalLoansCount">0</h3>
        </div>
        <div class="dash-box">
            <h4>Active Loan Total</h4>
            <h3 id="totalAmountSum">₹0</h3>
        </div>
        <div class="dash-box" style="border-left:1px solid rgba(255,255,255,0.3);padding-left:15px;">
            <h4 id="dueThisMonthLabel">Due This Month</h4>
            <h3 id="dueThisMonthSum">₹0</h3>
        </div>
        <div class="dash-box" style="border-left:1px solid rgba(255,255,255,0.3);padding-left:15px;">
            <h4>Overdue</h4>
            <h3 id="publicOverdueSum">₹0</h3>
            <small id="publicOverdueCount">0 EMI</small>
        </div>
        <div class="dash-box" style="border-left:1px solid rgba(255,255,255,0.3);padding-left:15px;">
            <h4>Kal Due</h4>
            <h3 id="publicTomorrowDue">₹0</h3>
        </div>
        <div class="dash-box" style="border-left:1px solid rgba(255,255,255,0.3);padding-left:15px;">
            <h4>Next 7 Days</h4>
            <h3 id="publicNext7Due">₹0</h3>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls no-print" id="mainControls">
        <button class="btn btn-view" onclick="showContactPage()">🎧 Contact</button>
        <button class="btn btn-danger" onclick="window.location.href='advanced_admin_login_panel.html'">🔐 Admin Login</button>
    </div>

    <!-- Search -->
    <div class="search-container no-print">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search borrower or Loan ID..." onkeyup="handleSearch()">
        <select id="sortSelect" class="search-box" onchange="handleSearch()">
            <option value="name">🔤 Sort by Name</option>
            <option value="highest">📈 Highest Amount</option>
            <option value="lowest">📉 Lowest Amount</option>
        </select>
    </div>

    <!-- Tabs -->
    <div class="tabs no-print" role="tablist" aria-label="Browse loans">
        <button type="button" class="tab active" id="tabFolder" role="tab" aria-selected="true" aria-controls="folderView" onclick="switchTab('folder')">📁 By Name</button>
        <button type="button" class="tab" id="tabMonth" role="tab" aria-selected="false" aria-controls="monthView" onclick="switchTab('month')">📅 By Month</button>
    </div>

    <!-- View Toggle -->
    <div class="view-controls no-print" id="viewControlsContainer">
        <button class="btn btn-view" onclick="toggleLayout()" id="layoutToggleBtn">🔲 Grid View</button>
    </div>

    <!-- Contact Page -->
    <div id="contactPageContainer" class="no-print">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h3 style="margin:0;color:#1a73e8;">🎧 Help & Support</h3>
            <button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="hideContactPage()">❌ Close</button>
        </div>
        <div class="contact-compact-container">
            <a href="tel:9301270671" class="contact-btn phone-btn">
                <span class="icon">📱</span>
                <div class="details">
                    <span class="label">Call Admin</span>
                    <span class="value">+91 9301270671</span>
                </div>
            </a>
            <a href="mailto:Abhishekbhardwaj7763@gmail.com" class="contact-btn email-btn">
                <span class="icon">✉️</span>
                <div class="details">
                    <span class="label">Email Admin</span>
                    <span class="value">Abhishekbhardwaj...</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <div id="folderView"></div>

        <div id="detailView" style="display:none;">
            <div class="controls no-print public-detail-actions" style="justify-content:space-between;">
                <div>
                    <button class="btn btn-secondary" onclick="goBackToFolders()">🔙 Back</button>
                    <button class="btn btn-warning" onclick="printStatement()">🖨️ Print</button>
                </div>
            </div>
            <h3 id="currentFolderName" style="text-align:center;color:#1a73e8;margin-top:15px;margin-bottom:15px;"></h3>
            <div id="loanList"></div>
        </div>

        <div id="monthView" style="display:none;"></div>

        <div id="monthDetailView" style="display:none;">
            <div class="controls no-print" style="justify-content:flex-start;">
                <button class="btn btn-secondary" onclick="goBackToMonths()">🔙 Back</button>
            </div>
            <div class="month-header" id="currentMonthName"></div>
            <div id="monthDateList"></div>
        </div>
    </div>


    <!-- Phase 15: Mobile quick navigation -->
    <nav class="phase15-mobile-nav no-print" aria-label="Mobile quick navigation">
        <button type="button" onclick="switchTab('folder');window.scrollTo({top:0,behavior:'smooth'})"><span>🏠</span><small>Home</small></button>
        <button type="button" onclick="switchTab('month');window.scrollTo({top:0,behavior:'smooth'})"><span>📅</span><small>Month</small></button>
        <button type="button" onclick="manualSync()"><span>🔄</span><small>Sync</small></button>
        <button type="button" onclick="showContactPage()"><span>🎧</span><small>Contact</small></button>
        <button type="button" onclick="window.location.href='advanced_admin_login_panel.html'"><span>🔐</span><small>Admin</small></button>
    </nav>

    <script src="pwa.js"></script>
    <script src="public_script.js"></script>
    <script src="ui_public_dues.js"></script>
    <script src="ui_public_dues_compact.js"></script>
</body>
</html>
